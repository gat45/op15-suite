[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvix-memory"
version = "0.3.0"
description = "Persistent, multi-layered cognitive memory system for AI agents"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
vector = [
    "sentence-transformers>=2.0.0",
    "numpy>=1.24.0",
]
ui = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
]
llm = []
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
jarvix-ui = "jarvix_memory.ui.app:main"
jarvix-server = "jarvix_memory.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvix_memory = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
