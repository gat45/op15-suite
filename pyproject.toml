[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "op15-suite"
version = "0.1.0"
description = "OnePlus 15 knowledge & MoE pipeline: RAG forensics, JARVIX memory, UPIA timeline, MCP doctor, MoE campaign runner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "videl" }]
dependencies = []

[project.scripts]
op15 = "op15suite.cli:main"

[tool.setuptools.packages.find]
include = ["op15suite*"]

[tool.setuptools]
# les outils vivent dans tools/ (scripts exécutables, pas un package importé)
