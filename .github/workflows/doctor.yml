name: mcp-doctor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (graft MCP)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install graft CLI
        # version épinglée = celle validée en prod (doctor 4/4, cache npx sain)
        run: npm install -g @nanonets/graft@0.18.0

      - name: Run mcp_doctor (handshakes + real tool probes)
        id: doctor
        env:
          # registre CI : graft seul (les serveurs de prod — jarvix, upia,
          # unified_recall — dépendent de stores locaux, hors runner)
          MCP_DOCTOR_REGISTRY: ${{ github.workspace }}/.github/workflows/doctor-registry-ci.json
        run: |
          python3 tools/mcp_doctor.py --json --out doctor-report.json || true
          cat doctor-report.json

      - name: Validate report schema (gate)
        # le rapport DOIT rester consommable (session reports, dashboards) :
        # un rapport absent ou hors schéma casse le job, même si doctor a
        # lui-même tourné avec || true
        run: python3 tools/validate_doctor_report.py doctor-report.json

      - name: Upload doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-report
          path: doctor-report.json
          if-no-files-found: warn

      - name: Step summary
        if: always()
        run: |
          {
            echo "## mcp_doctor report"
            echo '```json'
            cat doctor-report.json 2>/dev/null || echo '{"error": "report missing"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  install-test:
    name: install-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (pip install -e .)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: CLI responds (op15 --help)
        run: op15 --help

      - name: CLI subcommands parse
        run: |
          op15 campaign --list
          op15 doctor --help
          op15 rag --help
