name: mcp-doctor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # nightly 02:30 UTC
    - cron: "30 2 * * *"

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (graft MCP)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install graft CLI
        # version épinglée = celle validée en prod (doctor 4/4, cache npx sain)
        run: npm install -g @nanonets/graft@0.18.0

      - name: Run mcp_doctor (handshakes + real tool probes)
        id: doctor
        env:
          # registre CI : graft seul (les serveurs de prod — jarvix, upia,
          # unified_recall — dépendent de stores locaux, hors runner)
          MCP_DOCTOR_REGISTRY: ${{ github.workspace }}/.github/workflows/doctor-registry-ci.json
        run: |
          python3 tools/mcp_doctor.py --json --out doctor-report.json || true
          cat doctor-report.json

  nightly-campaign:
    name: nightly campaign §8 dry-run
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (pip install -e .)
        run: pip install -e .

      - name: Dry-run campagne (G0 attendu FAIL sans device)
        # Pas d'OP15 sur le runner : la chaîne doit verrouiller proprement à
        # G0 (device absent) et produire un rapport JSON archivable — c'est le
        # test de non-régression de la mécanique de gates. NB : le script
        # écrit ses artefacts sous tools/governor_state/ (relatif à lui-même).
        run: |
          python3 tools/campaign_moe.py --model examples/queries.txt \
            || echo "exit=$? (échec G0 attendu sans device)"
          n=$(ls tools/governor_state/moe/campaign_*.json 2>/dev/null | wc -l)
          [ "$n" -ge 1 ] && echo "rapport de campagne présent ($n)"

      - name: Validate campaign report
        # glob serré : uniquement les rapports datés (campaign_YYYYMMDD_HHMMSS),
        # pas campaign_state.json qui vit dans le même dossier
        run: |
          py=$(python3 -c 'import glob,re; c=[f for f in glob.glob("tools/governor_state/moe/campaign_*.json") if re.match(r"campaign_\d{8}_\d{6}\.json$", f.split("/")[-1].split("\\")[-1])]; print(sorted(c)[-1])')
          echo "rapport: $py"
          python3 - "$py" <<'PYEOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          assert r.get("failed_at") == "G0", f"failed_at={r.get('failed_at')!r}, attendu G0"
          g0 = r["gates"]["G0"]
          detail = g0.get("detail", {})
          msg = (detail.get("error", "") + " " + detail.get("remediation", "")).lower()
          assert g0["ok"] is False and "device" in msg, "G0 sans message device"
          assert "gates" in r and "date" in r
          print("VALID: rapport campagne conforme (verrou G0 OK)")
          PYEOF

      - name: Archive campaign report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-report
          path: tools/governor_state/moe/campaign_*.json
          if-no-files-found: error

      - name: Upload doctor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-report
          path: doctor-report.json
          if-no-files-found: warn

      - name: Step summary
        if: always()
        run: |
          {
            echo "## mcp_doctor report"
            echo '```json'
            cat doctor-report.json 2>/dev/null || echo '{"error": "report missing"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  install-test:
    name: install-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (pip install -e .)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: CLI responds (op15 --help)
        run: op15 --help

      - name: CLI subcommands parse
        run: |
          op15 campaign --list
          op15 doctor --help
          op15 rag --help
